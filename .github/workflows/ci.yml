name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — migrations, typecheck, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pantry
          POSTGRES_PASSWORD: pantry
          POSTGRES_DB: smart_pantry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pantry" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pantry:pantry@localhost:5432/smart_pantry
      TEST_DATABASE_URL: postgresql://pantry:pantry@localhost:5432/smart_pantry_test
      JWT_SECRET: ci-secret-that-is-at-least-thirty-two-characters-long
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Check migrations match schema.prisma (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - name: Create test database
        run: PGPASSWORD=pantry psql -h localhost -U pantry -d smart_pantry -c "CREATE DATABASE smart_pantry_test"
      - name: Unit + integration tests
        run: npm test
      - run: npm run build

  frontend:
    name: Frontend — typecheck, build, end-to-end
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pantry
          POSTGRES_PASSWORD: pantry
          POSTGRES_DB: smart_pantry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pantry" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pantry:pantry@localhost:5432/smart_pantry
      JWT_SECRET: ci-secret-that-is-at-least-thirty-two-characters-long
      CLIENT_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Start the API
        working-directory: server
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build
          nohup node dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 1; done
      - name: Install client
        working-directory: client
        run: npm ci
      - run: npm run typecheck
        working-directory: client
      - name: Client unit tests (quick-add parser)
        run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + mobile)
        working-directory: client
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
      - name: API log
        if: failure()
        run: cat server/api.log
